name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: >
          dotnet publish DDCompanion.csproj
          -f net10.0-windows10.0.19041.0
          -c Release
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:PublishSingleFile=true
          -o publish

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DDCompanion-Windows
          path: publish/
