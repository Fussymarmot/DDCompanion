<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DDCompanion</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="DDCompanion.styles.css" />
    <link rel="stylesheet" href="css/ddcompanion-components.css" />
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="css/loading.css" />
    <link rel="stylesheet" href="css/fonts.css">
</head>

<body> 
    <div class="status-bar-safe-area"></div>

    <div id="app"></div>

    <div id="loading-screen" class="loading-screen">
        <div class="loading-logo">D&amp;D</div>
    </div>
    
    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred. 
        <a href="." class="reload">Reload</a> 
        <span class="dismiss">🗙</span> 
    </div>
    
    <script src="_framework/blazor.webview.js" autostart="false"></script> <script src="app.js"></script>
</body>

    <script> 
        (() => { 
            const loadingScreen = document.getElementById("loading-screen");
            const loadingLogo = document.querySelector(".loading-logo"); 
            
            let animationFinished = false; 
            let blazorReady = false; 
            let hidden = false; 
            
            function tryHideLoadingScreen() { 
                if (hidden || !animationFinished || !blazorReady) {
                    return; 
                } 
                
                hidden = true; 
                
                loadingScreen.classList.add("hide"); 
                
                loadingScreen.addEventListener("transitionend", () => { 
                    loadingScreen.remove(); 
                    }, { once: true }); 
            } 
            
            // Кровь полностью заполнила D&D 
            loadingLogo.addEventListener("animationend", () => { 
                animationFinished = true; 
                tryHideLoadingScreen(); 
                }, { once: true }); 
            
            // Вызывается из Blazor, когда приложение готово 
            window.blazorReady = function () { 
                blazorReady = true; 
                tryHideLoadingScreen(); 
            }; 
        })(); </script>


</html>
